name: CI
on:
  push: { branches: [main, master] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      # npm ci and not npm install: a mismatched package-lock must fail
      # here, not for whoever installs the package from npm.
      - run: npm ci
      - run: npm run build
      - run: npm test
